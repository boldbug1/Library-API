<!DOCTYPE html>
<html>
<head>
    <title>Library API</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Library API</h1>
    <p>Welcome to my library project.</p>
<form id="inpt-container">
    <label for="title-inpt">Title : </label>
    <input type="text" id="title-inpt" required>
    <br>
    <label for="author-inpt">Author : </label>
    <input type="text" id="author-inpt" required>
    <button type="submit">Add</button>
</form>
<div class="books" id="books-container"></div>
.
<form action="" id="edit-form">
    <label for="edit-title-inpt">Title : </label>
    <input type="text" id="edit-title-inpt">
    <label for="edit-author-inpt">Author : </label>
    <input type="text" id="edit-author-inpt">
    <button style="background-color: red;" onclick="hideEditContainer()" type="button">Cancel</button>
    <button type="submit">Confirm</button>
</form>
<script src="script.js"></script>
</body>
</html>
