<!DOCTYPE html>
<html>
<head>
    <title>Library API</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <header>
        <h1>Library API</h1>
        <p>Welcome to my library project.</p>
    </header>

    <button
        id="add-book-btn"
        onclick="showContainer()"
        aria-label="Add Book">
        &plus;
    </button>

    <form id="inpt-container">
        <label for="title-inpt">Title</label>
        <input type="text" id="title-inpt" required>

        <label for="author-inpt">Author</label>
        <input type="text" id="author-inpt" required>

        <p id="error-container"></p>

        <div class="form-actions">
            <button
                class="cancel-btn"
                type="button"
                onclick="hideContainer()">
                Cancel
            </button>

            <button type="submit">
                Add Book
            </button>
        </div>
    </form>

    <div class="books" id="books-container"></div>

    <form id="edit-form">
        <h3 style="text-align: center;">Edit</h1>
        <label for="edit-title-inpt">Title</label>
        <input type="text" id="edit-title-inpt">

        <label for="edit-author-inpt">Author</label>
        <input type="text" id="edit-author-inpt">

        <p id="edit-error-container"></p>

        <div class="form-actions">
            <button
                class="cancel-btn"
                type="button"
                onclick="hideEditContainer()">
                Cancel
            </button>

            <button type="submit">
                Confirm
            </button>
        </div>
    </form>

    <script src="script.js"></script>

</body>
</html>
